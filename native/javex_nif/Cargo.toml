[package]
name = "javex_nif"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.96"

[lib]
name = "javex_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[[bin]]
name = "javex_worker"
path = "src/worker.rs"

# Rustler 0.30+ requires NIF version features so rustler_precompiled's
# build action can pick the right one via --features nif_version_2_XX.
[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
nif_version_2_17 = ["rustler/nif_version_2_17"]

[dependencies]
rustler = { version = "0.37", default-features = false }
wasmtime = { version = "=49.0.3", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
wasmtime-wasi = { version = "=49.0.3", default-features = false, features = ["p1"] }
walrus = "0.27"
wasmparser = "0.251"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "net", "time"] }
bytes = "1"
sha2 = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
