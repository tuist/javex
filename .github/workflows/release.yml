name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Force a specific version (no v prefix). Leave empty to derive from commits."
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  decide:
    name: Decide next version
    needs: verify
    runs-on: tuist-linux
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        shell: bash
        run: |
          set -euo pipefail
          GC_VERSION="2.6.1"
          URL="https://github.com/orhun/git-cliff/releases/download/v${GC_VERSION}/git-cliff-${GC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$URL" -o /tmp/git-cliff.tar.gz
          mkdir -p /tmp/git-cliff
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/git-cliff --strip-components 1
          sudo install /tmp/git-cliff/git-cliff /usr/local/bin/git-cliff

      - name: Decide next version
        id: next
        shell: bash
        env:
          FORCED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$FORCED_VERSION" ]]; then
            # Pre-release versions force RustlerPrecompiled to build from
            # source, so only stable SemVer versions can be published here.
            if [[ ! "$FORCED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a stable SemVer version without a v prefix" >&2
              exit 1
            fi
            VERSION="$FORCED_VERSION"
            echo "Forced version via workflow_dispatch: ${VERSION}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture both stdout (the version string) and stderr (where
          # git-cliff says "There is nothing to bump") in one go.
          if ! GC_OUT="$(git-cliff --config cliff.toml --bumped-version 2>&1)"; then
            printf '%s\n' "$GC_OUT" >&2
            exit 1
          fi
          NEXT="$(printf '%s\n' "$GC_OUT" | tail -n1)"
          LATEST="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

          echo "Latest tag:               ${LATEST:-(none)}"
          echo "git-cliff bumped-version: ${NEXT:-(none)}"

          # Three reasons to skip:
          #   (a) git-cliff explicitly said nothing bumps;
          #   (b) git-cliff returned the same string as the latest tag;
          #   (c) git-cliff returned a version <= the latest tag (it
          #       can do this when the "latest" tag points at a commit
          #       whose only contents are filtered, e.g. our own
          #       chore(release): bump commit).
          if printf '%s\n' "$GC_OUT" | grep -q "nothing to bump"; then
            echo "git-cliff: nothing to bump; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$NEXT" || "$NEXT" == "$LATEST" ]]; then
            echo "No new version proposed; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never pass arbitrary CLI output into later shell commands or
          # artifact names, even when git-cliff exits successfully.
          if [[ ! "$NEXT" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "git-cliff did not return a stable SemVer version" >&2
            exit 1
          fi
          NEXT="v${NEXT#v}"

          if [[ -n "$LATEST" ]]; then
            HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$NEXT" | sort -V | tail -n1)"
            if [[ "$HIGHEST" == "$LATEST" ]]; then
              echo "Proposed ${NEXT} is not greater than ${LATEST}; skipping release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          VERSION="${NEXT#v}"
          echo "Will release ${NEXT}"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build_nif:
    name: NIF ${{ matrix.job.target }}
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16"]
        job:
          - { target: aarch64-apple-darwin,      os: tuist-macos,      lib-ext: dylib }
          # Tuist's fleet has no native Intel macOS or ARM Linux pool.
          # Keep native execution on these two hosted runners.
          - { target: x86_64-apple-darwin,       os: macos-15-intel,   lib-ext: dylib }
          - { target: x86_64-unknown-linux-gnu,  os: tuist-linux,      lib-ext: so    }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, lib-ext: so    }

    env:
      MIX_ENV: test
      JAVEX_BUILD: "0"
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "false"
      RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/.nif-cache

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Verify native build architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.job.target }}"
          rustup target add ${{ matrix.job.target }}

      - name: Compute NIF feature flag
        id: feature
        shell: bash
        run: echo "flag=nif_version_$(echo ${{ matrix.nif }} | tr . _)" >> "$GITHUB_OUTPUT"

      - name: Build NIF
        shell: bash
        working-directory: native/javex_nif
        run: |
          cargo build --locked --release \
            --target ${{ matrix.job.target }} \
            --no-default-features \
            --features ${{ steps.feature.outputs.flag }}

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          NIF="${{ matrix.nif }}"
          TARGET="${{ matrix.job.target }}"
          SRC_EXT="${{ matrix.job.lib-ext }}"

          # rustler_precompiled expects the artifact to be named with
          # a `.so` suffix in the tarball regardless of the host
          # platform, because Rustler renames all NIF shared libraries
          # to .so inside priv/native at load time.
          NAME="libjavex_nif-v${VERSION}-nif-${NIF}-${TARGET}"
          ARCHIVE="${NAME}.so.tar.gz"

          SRC="native/javex_nif/target/${TARGET}/release/libjavex_nif.${SRC_EXT}"
          STAGE="$(mktemp -d)"
          cp "${SRC}" "${STAGE}/${NAME}.so"
          tar -C "${STAGE}" -czf "${ARCHIVE}" "${NAME}.so"

          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "name=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Test packaged NIF with current library
        shell: bash
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^(  @version )\".*\"/\\1\"${VERSION}\"/" mix.exs
          rm mix.exs.bak

          # Compile from a clean tree with only this job's new archive in
          # cache; never download the previous release or rebuild locally.
          rm -rf _build priv/native "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH"
          mkdir -p priv/native "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH"
          cp "$ARCHIVE" "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH/"
          SUM="$(shasum -a 256 "$ARCHIVE" | cut -d' ' -f1)"
          printf '%%{\n  "%s" => "sha256:%s"\n}\n' "$ARCHIVE" "$SUM" \
            > checksum-Elixir.Javex.Native.exs

          mix deps.get
          mix test

          # A source-built NIF has a different name. Require the exact
          # packaged target library to have been extracted for this VM.
          cmp "native/javex_nif/target/${{ matrix.job.target }}/release/libjavex_nif.${{ matrix.job.lib-ext }}" \
            "_build/test/lib/javex/priv/native/${ARCHIVE%.tar.gz}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    # Publishing across Hex, Git and GitHub is not transactional. Complete
    # verification and preparation before the irreversible steps:
    #   1. mix hex.publish     (cannot unpublish after 24h)
    #   2. git push --atomic   (commit + tag together)
    #   3. GH release create   (cosmetic, easiest to recreate manually)
    # Never rebase the release onto code that was not verified above.
    name: Publish verified release (hex + commit + tag + GH release)
    needs: [verify, decide, build_nif]
    if: needs.decide.outputs.release == 'true'
    runs-on: tuist-linux
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
      MIX_ENV: prod
      JAVEX_BUILD: "0"
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "false"
      RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/.nif-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install hex / rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install git-cliff
        shell: bash
        run: |
          set -euo pipefail
          GC_VERSION="2.6.1"
          URL="https://github.com/orhun/git-cliff/releases/download/v${GC_VERSION}/git-cliff-${GC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$URL" -o /tmp/git-cliff.tar.gz
          mkdir -p /tmp/git-cliff
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp/git-cliff --strip-components 1
          sudo install /tmp/git-cliff/git-cliff /usr/local/bin/git-cliff

      - name: Download NIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libjavex_nif-v${{ env.VERSION }}-nif-2.16-*.so.tar.gz
          path: artifacts
          merge-multiple: true

      - name: Bump @version in mix.exs
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^(  @version )\".*\"/\\1\"${VERSION}\"/" mix.exs
          rm mix.exs.bak
          grep '@version' mix.exs

      - name: Generate checksum file from real artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="checksum-Elixir.Javex.Native.exs"
          {
            echo "%{"
            for f in artifacts/*.tar.gz; do
              name="$(basename "$f")"
              sum="$(sha256sum "$f" | cut -d' ' -f1)"
              echo "  \"${name}\" => \"sha256:${sum}\","
            done
            echo "}"
          } > "$OUT"

      - name: Pre-seed rustler_precompiled cache for host
        # Stops the upcoming `mix hex.publish` compile step from trying
        # to download the linux-gnu NIF from a GitHub release that does
        # not exist yet (we create it after publishing to hex).
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p priv/native "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH"
          cp "artifacts/libjavex_nif-v${VERSION}-nif-2.16-x86_64-unknown-linux-gnu.so.tar.gz" \
             "$RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH/"

      - name: Generate release notes
        shell: bash
        run: |
          git-cliff --config cliff.toml --tag "v${VERSION}" --unreleased --strip header > CHANGES.md
          echo "--- CHANGES.md ---"
          cat CHANGES.md

      - name: Fetch deps
        run: mix deps.get --only prod

      - name: Validate package and docs before publishing
        run: |
          mix compile --warnings-as-errors
          mix hex.build
          mix docs --warnings-as-errors

      - name: Require main to still match the verified commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Main advanced since verification; a newer run must release it." >&2
            exit 1
          fi
          # Check the remote too: checkout may predate a tag created while
          # the builds ran. A failed remote lookup must fail closed.
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          if [[ -n "$REMOTE_TAG" ]] || git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            echo "Version v${VERSION} already exists." >&2
            exit 1
          fi

      ##
      # Irreversible block — order is load-bearing.
      ##

      - name: Publish to hex.pm (package + docs)
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Configure git
        run: |
          git config user.name  "tuistbot"
          git config user.email "noreply@tuist.dev"

      - name: Commit version bump and tag
        shell: bash
        run: |
          set -euo pipefail
          git add mix.exs checksum-Elixir.Javex.Native.exs
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"

      - name: Push commit and tag atomically
        shell: bash
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          files: artifacts/*
          fail_on_unmatched_files: true
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: false
          prerelease: false
