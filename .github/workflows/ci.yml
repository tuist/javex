name: CI

on:
  # Main pushes run this workflow through Release, so verification is
  # required for publishing without compiling and testing twice.
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  JAVEX_BUILD: "1"
  CARGO_BUILD_JOBS: "1"

jobs:
  lint:
    name: Lint (Quokka + Credo + Rust)
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          # Never restore BEAMs or NIFs compiled for older library code.
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/javex_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/javex_nif/Cargo.toml', 'native/javex_nif/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: mix deps.get
      - name: Check formatting (Quokka)
        run: mix format --check-formatted
      - name: Credo (strict)
        run: mix credo --strict
      - name: Rust formatting and clippy
        working-directory: native/javex_nif
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --no-default-features --features nif_version_2_16 -- -D warnings

  advisories:
    name: Dependency advisories (Hex + RustSec)
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Audit Hex dependencies
        run: |
          mix local.hex --force
          mix deps.get
          mix hex.audit
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file native/javex_nif/Cargo.lock

  compile:
    name: Compile without warnings
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/javex_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/javex_nif/Cargo.toml', 'native/javex_nif/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors --force

  test:
    name: Test
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/javex_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/javex_nif/Cargo.toml', 'native/javex_nif/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: mix deps.get
      - name: Native contract tests
        working-directory: native/javex_nif
        run: cargo test --release --locked --no-default-features --features nif_version_2_16
      - run: mix test --cover
