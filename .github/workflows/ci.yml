name: CI

on:
  # Main pushes run this workflow through Release, so verification is
  # required for publishing without compiling and testing twice.
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  JAVEX_BUILD: "1"
  CARGO_BUILD_JOBS: "1"

jobs:
  lint:
    name: Lint (Quokka + Credo + Rust)
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          # Never restore BEAMs or NIFs compiled for older library code.
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/javex_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/javex_nif/Cargo.toml', 'native/javex_nif/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: mix deps.get
      - name: Check formatting (Quokka)
        run: mix format --check-formatted
      - name: Credo (strict)
        run: mix credo --strict
      - name: Rust formatting and clippy
        working-directory: native/javex_nif
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --no-default-features --features nif_version_2_16 -- -D warnings

  advisories:
    name: Dependency advisories (Hex + RustSec)
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Audit Hex dependencies
        run: |
          mix local.hex --force
          mix deps.get
          mix hex.audit
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file native/javex_nif/Cargo.lock
          cargo audit --file native/javex_plugin/Cargo.lock

  provider:
    name: Custom provider build and lint
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Install provider build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev lld wasi-libc
          rustup target add wasm32-wasip1
          rustup component add rustfmt clippy
          curl -fsSL https://github.com/bytecodealliance/javy/releases/download/v8.1.1/javy-x86_64-linux-v8.1.1.gz -o /tmp/javy.gz
          echo '4bec224e1d51827808fd063541a2b4d94cf474744636b692be63e7a29bec83a6  /tmp/javy.gz' | sha256sum -c -
          gzip -dc /tmp/javy.gz > /tmp/javy
          chmod +x /tmp/javy
      - name: Check and rebuild provider
        run: |
          cargo fmt --manifest-path native/javex_plugin/Cargo.toml --check
          cargo clippy --manifest-path native/javex_plugin/Cargo.toml --locked --target wasm32-wasip1 -- -D warnings
          cp priv/javy_plugin.wasm /tmp/bundled-provider.wasm
          PATH="/tmp:$PATH" bash native/javex_plugin/build.sh
          cmp /tmp/bundled-provider.wasm priv/javy_plugin.wasm

  compile:
    name: Compile without warnings
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/javex_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/javex_nif/Cargo.toml', 'native/javex_nif/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors --force

  test:
    name: Test
    runs-on: tuist-linux
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/javex_nif/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/javex_nif/Cargo.toml', 'native/javex_nif/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: mix deps.get
      - name: Native contract tests
        working-directory: native/javex_nif
        run: cargo test --release --locked --no-default-features --features nif_version_2_16
      - run: mix test --cover
